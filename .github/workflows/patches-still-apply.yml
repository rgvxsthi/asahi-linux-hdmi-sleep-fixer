name: Patches still apply

# Upstream fairydust moves. When it does, one of two things is true: the
# patches here still apply, or they don't because the change landed upstream
# or the surrounding code was rewritten. Either way it is better to find out
# from a scheduled job than from someone two hours into a kernel build.

# The job only reads: it clones public sources and test-applies patches.
permissions:
  contents: read

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  push:
    paths:
      - 'patches/**'
      - '.github/workflows/patches-still-apply.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # asahi is the release branch, and what distro kernels build.
        # fairydust is asahi plus the USB-C DisplayPort work, so patch 0003
        # is expected to be already present there rather than applicable.
        # asahi-wip is deliberately absent. It carries part of the fairydust
        # range already (the arm64 config fixup that patch 0003 picks up as a
        # side effect of being a plain range diff), so 0003 there neither
        # applies nor reverse-applies. This job only knows those two states, so
        # including asahi-wip would report a permanent false failure. The build
        # script handles it correctly and skips 0003 on that branch.
        branch: [asahi, fairydust]
    name: ${{ matrix.branch }}
    steps:
      - name: Check out this repo
        uses: actions/checkout@v5
        with:
          path: tools

      - name: Check out upstream fairydust
        run: |
          # Blobless keeps this to a couple of minutes rather than pulling
          # the full history of the kernel.
          git clone --filter=blob:none --branch ${{ matrix.branch }} --single-branch \
            https://github.com/AsahiLinux/linux.git kernel

      - name: Report the base being tested
        working-directory: kernel
        run: |
          echo "kernel version: $(make kernelversion)"
          echo "${{ matrix.branch }} HEAD: $(git log --oneline -1)"

      - name: Try each patch
        working-directory: kernel
        run: |
          failed=0
          for p in ../tools/patches/*.patch; do
            name="$(basename "$p")"
            if git apply --check "$p" 2>/dev/null; then
              echo "::notice::applies cleanly: $name"
              git apply "$p"
            elif git apply --reverse --check "$p" 2>/dev/null; then
              # Expected for 0003 on fairydust, since that patch *is* the
              # fairydust delta. On the release branch it would instead mean
              # the change has landed upstream and the file can be dropped.
              echo "::notice::already present on ${{ matrix.branch }}: $name"
            else
              echo "::error::no longer applies: $name"
              git apply --check "$p" || true
              failed=1
            fi
          done
          exit "$failed"
